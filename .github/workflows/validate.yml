name: Validate
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js
      - name: Check required files
        run: |
          test -s index.html
          test -s assets/css/style.css
          test -s assets/js/app.js
          test -s assets/favicon.svg
      - name: Check HTML references
        run: |
          grep -q 'assets/css/style.css' index.html
          grep -q 'assets/js/app.js' index.html
          grep -q 'assets/favicon.svg' index.html
